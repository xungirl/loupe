[project]
name = "loupe-py"
version = "0.1.0"
description = "Python side of Loupe: SDK, hook adapter, mini coding agent, experiment harness"
requires-python = ">=3.11"
dependencies = []  # runtime is stdlib-only on purpose

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["sdk/python", "agents", "experiment", "importers"]
testpaths = ["importers/tests", "sdk/python/tests", "agents/tests", "experiment/tests"]
addopts = "-q"
